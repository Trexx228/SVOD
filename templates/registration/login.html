{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Вход в таймшит</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.errors %}
    <p style="color:var(--red);margin:0 0 8px">Неверный email или пароль, либо аккаунт не активирован.</p>
    {% endif %}
    {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <label for="id_username">Email</label>
    <input type="email" id="id_username" name="username" autocomplete="username"
           required autofocus value="{{ form.username.value|default:'' }}">

    <label for="id_password">Пароль</label>
    <input type="password" id="id_password" name="password"
           autocomplete="current-password" required>

    <p style="margin-top:16px"><button class="btn blue" type="submit">Войти</button></p>
  </form>

  <p style="margin:14px 0 0">
    <a href="{% url 'register' %}">Регистрация</a>
    · <a href="{% url 'resend' %}">Повторить письмо активации</a>
    · <a href="{% url 'password_reset' %}">Забыли пароль?</a>
  </p>
</div>
{% endblock %}
