{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
    <h2>Новый пароль</h2>
    {% if validlink %}
    <form method="post" novalidate>
        {% csrf_token %}
        {% if form.errors %}
        <p style="color:var(--red);margin:0 0 8px">Пароли не совпадают или слишком простые.</p>
        {% endif %}
        <label for="id_new_password1">Новый пароль</label>
        <input type="password" id="id_new_password1" name="new_password1"
               autocomplete="new-password" required>
        <label for="id_new_password2">Повторите пароль</label>
        <input type="password" id="id_new_password2" name="new_password2"
               autocomplete="new-password" required>
        <p style="margin-top:16px"><button class="btn blue" type="submit">Сохранить</button></p>
    </form>
    {% else %}
    <p style="color:var(--red)">Ссылка недействительна или уже использована.</p>
    <p><a class="btn blue" style="padding:8px 18px" href="{% url 'password_reset' %}">Запросить новую</a></p>
    {% endif %}
</div>
{% endblock %}
