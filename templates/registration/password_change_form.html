{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
    <h2>Смена пароля</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% if form.errors %}
        <p style="color:var(--red);margin:0 0 8px">
            Пароли не совпадают или слишком простые.
        </p>
        {% endif %}
        <label for="id_old_password">Текущий пароль</label>
        <input type="password" id="id_old_password" name="old_password" required autocomplete="current-password">

        <label for="id_new_password1">Новый пароль</label>
        <input type="password" id="id_new_password1" name="new_password1" required autocomplete="new-password">

        <label for="id_new_password2">Повторите новый пароль</label>
        <input type="password" id="id_new_password2" name="new_password2" required autocomplete="new-password">

        <p style="margin-top:16px"><button class="btn blue" type="submit">Сохранить</button></p>
    </form>
</div>
{% endblock %}
