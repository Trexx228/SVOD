{% extends 'base.html' %}
{% block content %}
<h2 style="margin:0 0 14px">
    {% if branch %}Ветка · {{ branch.name }}{% else %}Новая ветка{% endif %}
</h2>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <a class="pill" href="{% url 'settings_order_detail' order.pk %}">← Заказ {{ order.number }}</a>
</div>

<div class="card" style="max-width:560px">
    <form method="post">
        {% csrf_token %}

        <label>Название ветки</label>
        <input name="name" required maxlength="150" value="{{ branch.name|default:'' }}"
               placeholder="Например, Проектирование">

        <p style="margin-top:18px">
            <button type="submit" class="btn green">
                {% if branch %}Сохранить{% else %}Создать{% endif %}
            </button>
        </p>
    </form>
</div>
{% endblock %}
